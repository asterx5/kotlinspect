name: iOS

# Verifies the Swift package on macOS: XCFramework build, package tests on a simulator, public
# interface check, the Swift sample's UI tests in Debug and Release, and dependency checks.
# It never publishes anything. Each step runs through .github/scripts/step.sh, which turns the
# lines explaining a failure into annotations.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLINSPECT_LOCAL_XCFRAMEWORK: kotlinspect-core/build/XCFrameworks/release/KotlinspectCore.xcframework
  STEP: .github/scripts/step.sh

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin tests on the iOS simulator
        run: $STEP kotlin-ios-tests ./gradlew :kotlinspect-core:iosSimulatorArm64Test :kotlog:iosSimulatorArm64Test --console=plain

      - name: Build the XCFramework
        run: $STEP xcframework ./gradlew :kotlinspect-core:assembleKotlinspectCoreReleaseXCFramework --console=plain

      - name: Inspect the framework
        run: |
          set -e
          BIN="$KOTLINSPECT_LOCAL_XCFRAMEWORK/ios-arm64/KotlinspectCore.framework/KotlinspectCore"
          ls "$KOTLINSPECT_LOCAL_XCFRAMEWORK"
          SIZE=$(du -h "$BIN" | cut -f1)
          KTOR=$(nm "$BIN" | grep -c 'io.ktor' || true)
          echo "::notice title=XCFramework::arm64 binary $SIZE, $KTOR Ktor symbols"
          # kotlinspect-core contains the Ktor plugin by design (it is one artifact), so Ktor's
          # client core can be inside; no Ktor engine may be.
          if nm "$BIN" | grep -q 'io.ktor.client.engine.darwin'; then echo "::error::A Ktor engine is inside the framework"; exit 1; fi
          (cd kotlinspect-core/build/XCFrameworks/release && ditto -c -k --keepParent KotlinspectCore.xcframework KotlinspectCore.xcframework.zip)

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime: continue
              for d in items:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "::notice title=Simulator::$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Package tests
        run: |
          $STEP package-tests xcodebuild test -scheme Kotlinspect-Package -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/results/package.xcresult

      # The interface is generated with library evolution only to read it. Its re-verification is
      # skipped: the module and its main type are both named Kotlinspect, which textual interfaces
      # cannot express (a known Swift limitation that does not affect source builds).
      - name: Public Swift interface has no Kotlin types
        run: |
          set -e
          $STEP interface-build xcodebuild build -scheme Kotlinspect -destination "generic/platform=iOS Simulator" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES -derivedDataPath build/interface             OTHER_SWIFT_FLAGS='$(inherited) -no-verify-emitted-module-interface'
          FILES=$(find build/interface -name "*.swiftinterface" -path "*Kotlinspect.swiftmodule*" ! -name "*.private.swiftinterface")
          test -n "$FILES" || { echo "::error::No Kotlinspect.swiftinterface was produced"; exit 1; }
          if grep -nE '\.shared\b|\bKS[A-Z][A-Za-z]+|\bKotlin(Boolean|Byte|Short|Int|Long|Float|Double|Number|Unit|Array|Throwable|Base)\b' $FILES > build/leaks.txt; then
            while IFS= read -r line; do echo "::error title=Kotlin type in public interface::$line"; done < build/leaks.txt
            exit 1
          fi

      - name: Generate the sample project
        run: |
          brew install xcodegen
          cd samples/swift-ios && xcodegen generate

      - name: Sample UI tests (Debug)
        run: |
          $STEP sample-debug xcodebuild test -project samples/swift-ios/KotlinspectSample.xcodeproj -scheme KotlinspectSample \
            -configuration Debug -destination "id=${{ steps.sim.outputs.udid }}" -skip-testing:KotlinspectSampleUITests/ReleaseTests \
            -resultBundlePath build/results/sample-debug.xcresult

      - name: Sample UI test (Release)
        run: |
          $STEP sample-release xcodebuild test -project samples/swift-ios/KotlinspectSample.xcodeproj -scheme KotlinspectSample \
            -configuration Release -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:KotlinspectSampleUITests/ReleaseTests \
            -resultBundlePath build/results/sample-release.xcresult

      - name: Apps using only Kotlinspect never fetch Alamofire
        run: |
          set -e
          ROOT="$PWD"
          mkdir -p build/scratch/Sources/Scratch
          cat > build/scratch/Package.swift <<EOF
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "Scratch",
              platforms: [.iOS(.v14)],
              dependencies: [.package(path: "$ROOT")],
              targets: [.target(name: "Scratch", dependencies: [.product(name: "Kotlinspect", package: "kotlinspect")])]
          )
          EOF
          echo 'import Kotlinspect' > build/scratch/Sources/Scratch/Scratch.swift
          export KOTLINSPECT_LOCAL_XCFRAMEWORK
          (cd build/scratch && $ROOT/$STEP scratch-resolve xcodebuild -resolvePackageDependencies -scheme Scratch)
          if grep -qi "alamofire" build/scratch/build/logs/scratch-resolve.log; then
            echo "::error::Alamofire was fetched for a Kotlinspect-only app"; exit 1
          fi
          echo "::notice title=Scratch app::resolved without Alamofire"

      - name: Alamofire floor (5.4.0)
        run: |
          set -e
          sed -i '' 's/.upToNextMajor(from: "5.4.0")/.exact("5.4.0")/' Package.swift
          $STEP alamofire-floor xcodebuild build -scheme KotlinspectAlamofire -destination "generic/platform=iOS Simulator"
          git checkout Package.swift

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            build/results
            build/logs
            kotlinspect-core/build/XCFrameworks/release/KotlinspectCore.xcframework.zip
          if-no-files-found: ignore
