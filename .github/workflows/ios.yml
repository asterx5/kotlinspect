name: iOS

# Verifies the Swift packages on macOS: XCFramework build, package tests on a simulator (Kotlinspect
# and the Alamofire adapter in swift/KotlinspectAlamofire), public interface check, the Swift
# sample's UI tests in Debug and Release, and dependency checks.
# It never publishes anything. Each step runs through .github/scripts/step.sh, which turns the
# lines explaining a failure into annotations.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLINSPECT_LOCAL_XCFRAMEWORK: kotlinspect-core/build/XCFrameworks/release/KotlinspectCore.xcframework
  STEP: .github/scripts/step.sh

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin tests on the iOS simulator
        run: $STEP kotlin-ios-tests ./gradlew :kotlinspect-core:iosSimulatorArm64Test :kotlog:iosSimulatorArm64Test --console=plain

      - name: Build the XCFramework
        run: $STEP xcframework ./gradlew :kotlinspect-core:assembleKotlinspectCoreReleaseXCFramework --console=plain

      - name: Inspect the framework
        run: |
          set -e
          BIN="$KOTLINSPECT_LOCAL_XCFRAMEWORK/ios-arm64/KotlinspectCore.framework/KotlinspectCore"
          ls "$KOTLINSPECT_LOCAL_XCFRAMEWORK"
          SIZE=$(du -h "$BIN" | cut -f1)
          KTOR=$(nm "$BIN" | grep -c 'io.ktor' || true)
          echo "::notice title=XCFramework::arm64 binary $SIZE, $KTOR Ktor symbols"
          # kotlinspect-core contains the Ktor plugin by design (it is one artifact), so Ktor's
          # client core can be inside; no Ktor engine may be.
          if nm "$BIN" | grep -q 'io.ktor.client.engine.darwin'; then echo "::error::A Ktor engine is inside the framework"; exit 1; fi
          (cd kotlinspect-core/build/XCFrameworks/release && ditto -c -k --keepParent KotlinspectCore.xcframework KotlinspectCore.xcframework.zip)

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime: continue
              for d in items:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "::notice title=Simulator::$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Xcode names a package's test scheme "<name>-Package" only when it has several products.
      - name: Package tests
        run: |
          set -e
          scheme() { xcodebuild -list -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print(sys.argv[1]+"-Package" if sys.argv[1]+"-Package" in s else sys.argv[1])' "$1"; }
          $STEP package-tests xcodebuild test -scheme "$(scheme Kotlinspect)" -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/results/package.xcresult
          ROOT="$PWD"
          cd swift/KotlinspectAlamofire
          "$ROOT/$STEP" alamofire-tests xcodebuild test -scheme "$(scheme KotlinspectAlamofire)" -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$ROOT/build/results/alamofire.xcresult"

      # The interface is generated with library evolution only to read it. Its re-verification is
      # skipped: the module and its main type are both named Kotlinspect, which textual interfaces
      # cannot express (a known Swift limitation that does not affect source builds).
      - name: Public Swift interface has no Kotlin types
        run: |
          set -e
          $STEP interface-build xcodebuild build -scheme Kotlinspect -destination "generic/platform=iOS Simulator" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES -derivedDataPath build/interface             OTHER_SWIFT_FLAGS='$(inherited) -no-verify-emitted-module-interface'
          FILES=$(find build/interface -name "*.swiftinterface" -path "*Kotlinspect.swiftmodule*" ! -name "*.private.swiftinterface")
          test -n "$FILES" || { echo "::error::No Kotlinspect.swiftinterface was produced"; exit 1; }
          if grep -nE '\.shared\b|\bKS[A-Z][A-Za-z]+|\bKotlin(Boolean|Byte|Short|Int|Long|Float|Double|Number|Unit|Array|Throwable|Base)\b' $FILES > build/leaks.txt; then
            while IFS= read -r line; do echo "::error title=Kotlin type in public interface::$line"; done < build/leaks.txt
            exit 1
          fi

      - name: Generate the sample project
        run: |
          brew install xcodegen
          cd samples/swift-ios && xcodegen generate

      - name: Sample UI tests (Debug)
        run: |
          # A simulator booting during the first app launch can time out XCUITest's launch.
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > /dev/null
          $STEP sample-debug xcodebuild test -project samples/swift-ios/KotlinspectSample.xcodeproj -scheme KotlinspectSample \
            -configuration Debug -destination "id=${{ steps.sim.outputs.udid }}" -skip-testing:KotlinspectSampleUITests/ReleaseTests \
            -resultBundlePath build/results/sample-debug.xcresult

      # Release builds every simulator architecture by default; the XCFramework's simulator slice
      # is arm64 only (iosX64 is not a published target), so build the active one.
      - name: Sample UI test (Release)
        run: |
          # Start clean: the Debug run's database must not count as one the Release build made.
          # simctl only uninstalls on a booted simulator.
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > /dev/null
          xcrun simctl uninstall "${{ steps.sim.outputs.udid }}" io.github.asterx5.kotlinspect.sample
          if xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" io.github.asterx5.kotlinspect.sample data 2>/dev/null; then
            echo "::error::The Debug sample is still installed"; exit 1
          fi
          echo "::notice title=Release check::the Debug sample and its data were removed"
          $STEP sample-release xcodebuild test -project samples/swift-ios/KotlinspectSample.xcodeproj -scheme KotlinspectSample \
            -configuration Release -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:KotlinspectSampleUITests/ReleaseTests \
            -resultBundlePath build/results/sample-release.xcresult ONLY_ACTIVE_ARCH=YES

      # Apps add the package by URL, so the scratch app does too: a throwaway git copy of this
      # commit with the built XCFramework committed at a relative path (a URL package cannot
      # point outside itself). Nothing is published. Xcode checks out every dependency a package
      # declares, which is why the Alamofire adapter is a package of its own: this step fails if a
      # Kotlinspect-only app downloads, compiles or links any Alamofire code.
      - name: Apps using only Kotlinspect never fetch Alamofire
        run: |
          set -e
          ROOT="$PWD"
          REPO="$RUNNER_TEMP/kotlinspect-git"
          git clone -q "$ROOT" "$REPO"
          (cd "$REPO" && git checkout -q "$GITHUB_SHA" && git checkout -q -b scratch)
          cp -R "$ROOT/$KOTLINSPECT_LOCAL_XCFRAMEWORK" "$REPO/KotlinspectCore.xcframework"
          (cd "$REPO" && git add -f KotlinspectCore.xcframework \
            && git -c user.name=ci -c user.email=ci@localhost commit -q -m "scratch: local framework")
          SCRATCH="$RUNNER_TEMP/scratch"
          mkdir -p "$SCRATCH/Sources/Scratch"
          cat > "$SCRATCH/Package.swift" <<EOF
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "Scratch",
              platforms: [.iOS(.v14)],
              products: [.library(name: "Scratch", targets: ["Scratch"])],
              dependencies: [.package(url: "file://$REPO", branch: "scratch")],
              targets: [.target(name: "Scratch", dependencies: [.product(name: "Kotlinspect", package: "kotlinspect-git")])]
          )
          EOF
          echo 'import Kotlinspect' > "$SCRATCH/Sources/Scratch/Scratch.swift"
          export KOTLINSPECT_LOCAL_XCFRAMEWORK=KotlinspectCore.xcframework
          (cd "$SCRATCH" && swift package resolve > /dev/null 2>&1 || true
            echo "::notice title=swift package resolve checkouts::$(ls .build/checkouts 2>/dev/null | tr '\n' ' ')")
          (cd "$SCRATCH" && "$ROOT/$STEP" scratch-build xcodebuild build -scheme Scratch \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$SCRATCH/dd" \
            -clonedSourcePackagesDirPath "$SCRATCH/packages")
          CHECKOUTS=$(ls "$SCRATCH/packages/checkouts" | tr '\n' ' ')
          echo "::notice title=Xcode checkouts::$CHECKOUTS"
          if echo "$CHECKOUTS" | grep -qi alamofire; then
            echo "::error::Alamofire was fetched for a Kotlinspect-only app"; exit 1
          fi
          find "$SCRATCH/dd/Build" -iname "*alamofire*" > "$SCRATCH/alamofire-products.txt"
          if [ -s "$SCRATCH/alamofire-products.txt" ]; then
            head -5 "$SCRATCH/alamofire-products.txt" | while IFS= read -r f; do echo "::error title=Alamofire built::$f"; done
            exit 1
          fi
          find "$SCRATCH/dd/Build" -name "Kotlinspect.swiftmodule" | grep -q . || { echo "::error::Kotlinspect was not built"; exit 1; }
          echo "::notice title=Scratch app::built with Kotlinspect, without fetching or building Alamofire"

      # The release copies the adapter to its own repository with this script; check its output.
      - name: Published form of the Alamofire adapter
        run: |
          set -e
          OUT="$RUNNER_TEMP/adapter-repo"
          .github/scripts/prepare-alamofire-repo.sh "$OUT" "https://github.com/${{ github.repository }}.git" 9.9.9
          (cd "$OUT" && swift package dump-package > "$RUNNER_TEMP/adapter.json")
          python3 - "$RUNNER_TEMP/adapter.json" <<'PY'
          import json, sys
          deps = json.load(open(sys.argv[1]))["dependencies"]
          text = json.dumps(deps)
          # Only URL dependencies; Kotlinspect pinned to the given version.
          assert len(deps) == 2 and all("sourceControl" in d for d in deps), text
          assert "kotlinspect.git" in text and "9.9.9" in text and "Alamofire" in text, text
          print("::notice title=Adapter repository::" + text[:800])
          PY
          test -f "$OUT/LICENSE" && test -f "$OUT/README.md" && test -d "$OUT/Sources/KotlinspectAlamofire"

      - name: Alamofire floor (5.4.0)
        run: |
          set -e
          ROOT="$PWD"
          cd swift/KotlinspectAlamofire
          sed -i '' 's/.upToNextMajor(from: "5.4.0")/.exact("5.4.0")/' Package.swift
          grep -q '.exact("5.4.0")' Package.swift
          "$ROOT/$STEP" alamofire-floor xcodebuild build -scheme KotlinspectAlamofire -destination "generic/platform=iOS Simulator"
          git checkout Package.swift

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            build/results
            build/logs
            kotlinspect-core/build/XCFrameworks/release/KotlinspectCore.xcframework.zip
          if-no-files-found: ignore
